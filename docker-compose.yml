services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-campuslife}
      POSTGRES_USER: ${DB_USER:-campuslife}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-campuslife}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-campuslife}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-campuslife}
      DB_USER: ${DB_USER:-campuslife}
      DB_PASSWORD: ${DB_PASSWORD:-campuslife}
      DATABASE_URL: postgres://${DB_USER:-campuslife}:${DB_PASSWORD:-campuslife}@db:5432/${DB_NAME:-campuslife}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      # Drop your Aiven pg_dump (custom format, -Fc) here as backup.dump
      - ./dbdump:/app/dbdump:ro

  frontend:
    build:
      context: .
      dockerfile: client/Dockerfile
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "3000:80"

volumes:
  pgdata:
