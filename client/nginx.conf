server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router (or any client-side router) — fall back to index.html
    # for any path that isn't a real static file.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the Django service. Adjust the path prefix here
    # if your DRF urls.py doesn't mount everything under /api/.
    location /api/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /admin/ {
        proxy_pass http://web:8000/admin/;
        proxy_set_header Host $host;
    }

    location /media/ {
        proxy_pass http://web:8000/media/;
        proxy_set_header Host $host;
    }

    location /static/ {
        proxy_pass http://web:8000/static/;
        proxy_set_header Host $host;
    }
}
