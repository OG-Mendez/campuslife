<!-- gallery/templates/gallery/picture_list.html -->
<form method="GET" action="{% url 'picture_list' %}">
    <label for="available_vacancy">Filter by Vacancy:</label>
        <input type="number" name="available_vacancy" id="available_vacancy" value="{{ request.GET.available_vacancy }}">

    <label for="lodge_name">Search by Name:</label>
    <input type="text" name="lodge_name" id="lodge_name" value="{{ request.GET.lodge_name }}">

    <label for="min_price">Min Price: </label>
    <input type="number" id="min_price" name="min_price"
           value="{{ min_price|default:'50000' }}" step="1" min="0">

    <br>
    <label for="max_price">Max Price: </label>
    <input type="number" id="max_price" name="max_price"
           value="{{ max_price|default:'300000' }}" step="1" min="0">
    <br>


    <label for="lodge_location">Search by location:</label>
    <select name="lodge_location" id="lodge_location">
        <option value="">All</option>
        <option value="umuchima">Umuchima</option>
        <option value="eziobodo">Eziobodo</option>
    </select>

    <button type="submit">Filter</button>
</form>
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Picture List</title>
</head>
<body>
    <h1>Pictures</h1>
    <ul>
        {% for picture in pictures %}
            <li>
                <a href="{% url 'picture_detail' picture.pk %}">
                    <img src="{{ picture.image.url }}" alt="{{ picture.lodge_name }}" style="width: 150px; height: auto;">
                    <p>{{ picture.lodge_name }}</p>
                </a>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
