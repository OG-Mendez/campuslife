<!-- gallery/templates/gallery/picture_detail.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ picture.lodge_name }}</title>
</head>
<body>
    <h1>{{ picture.lodge_name }}</h1>
    <div>
        <img src="{{ picture.image.url }}" alt="{{ picture.lodge_name }}" style="width: 300px; height: auto;">
    </div>
    <p>{{ picture.lodge_location }}</p>
    <p>{{ picture.lodge_price }}</p>
    <p>{{ picture.available_vacancy }}</p>
    <p>{{ picture.caretaker_number }}</p>

    <a href="{% url 'picture_list' %}">Back to Picture List</a>
</body>
</html>
